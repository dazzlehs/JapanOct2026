<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แผนเที่ยวญี่ปุ่น 7–19 ต.ค. 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0f1;
  --surface:#ffffff;
  --surface-2:#f6f7f8;
  --ink:#16191d;
  --ink-muted:#6b7280;
  --line:#e7e9ec;
  --line-strong:#16191d;
  --accent:#26539c;
  --accent-soft:#eef2f9;
  --accent-ink:#1c3d73;
  --warn:#ad2b21;
  --warn-soft:#fbeceb;
  --tip:#8a5c12;
  --tip-soft:#faf3e6;
  --shadow: 0 1px 2px rgba(20,22,26,.05);
  color-scheme: light;
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth; -webkit-text-size-adjust:100%; text-size-adjust:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'IBM Plex Sans Thai Looped','Noto Sans JP','Noto Sans',system-ui,sans-serif;
  font-size:15px;
  line-height:1.65;
  padding-inline:16px;
  padding-bottom:40px;
}
h1,h2{font-family:'IBM Plex Sans Thai Looped','Noto Sans JP',sans-serif; text-wrap:balance; margin:0;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}

a{color:var(--accent);}

.wrap{max-width:1180px; margin:0 auto;}

/* ---- Masthead ---- */
.masthead{
  padding-block:26px 16px;
  border-bottom:1px solid var(--line-strong);
  margin-bottom:18px;
}
.eyebrow{
  font-size:12px;
  font-weight:600;
  letter-spacing:.12em;
  color:var(--accent);
  text-transform:uppercase;
  margin-bottom:6px;
}
.masthead h1{
  font-size:clamp(22px,5vw,30px);
  font-weight:700;
  color:var(--ink);
}
.masthead .sub{
  color:var(--ink-muted);
  margin-top:6px;
  font-size:13.5px;
}

/* ---- Date-jump nav ---- */
.platform-nav{
  position:sticky;
  top:0;
  z-index:5;
  background:var(--bg);
  padding-block:10px;
  margin-bottom:22px;
  border-bottom:1px solid var(--line);
  display:flex;
  gap:6px;
  overflow-x:auto;
  scrollbar-width:none;
}
.platform-nav::-webkit-scrollbar{display:none;}
.platform-nav a{
  flex:none;
  font-family:'IBM Plex Sans Thai Looped',sans-serif;
  font-weight:600;
  font-size:13px;
  text-decoration:none;
  color:var(--accent-ink);
  background:var(--accent-soft);
  border:1px solid var(--line);
  border-radius:3px;
  padding:5px 10px;
}

/* ---- Overview table ---- */
.section-label{
  font-weight:600;
  font-size:12px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--ink-muted);
  margin:0 0 10px;
}
.overview-scroll{
  overflow-x:auto;
  border:1px solid var(--line);
  border-radius:4px;
  margin-bottom:34px;
  box-shadow:var(--shadow);
  background:var(--surface);
}
table.overview{
  width:100%;
  border-collapse:collapse;
  min-width:480px;
}
table.overview thead th{
  text-align:left;
  font-size:12px;
  font-weight:600;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--ink-muted);
  background:var(--surface-2);
  padding:10px 12px;
  white-space:nowrap;
  border-bottom:1px solid var(--line-strong);
}
table.overview tbody td{
  padding:10px 12px;
  border-bottom:1px solid var(--line);
  vertical-align:top;
  font-size:13.5px;
}
table.overview tbody tr:last-child td{border-bottom:none;}
table.overview tbody tr:hover{background:var(--surface-2);}
table.overview td.num{
  font-family:'IBM Plex Mono',monospace;
  font-weight:600;
  color:var(--accent);
  white-space:nowrap;
}
table.overview td.date{white-space:nowrap; color:var(--ink-muted);}
table.overview td.theme b{font-weight:600;}

/* ---- Day boards ---- */
.day-board{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:4px;
  box-shadow:var(--shadow);
  margin-bottom:26px;
  overflow:hidden;
  scroll-margin-top:72px;
}
.day-head{
  display:flex;
  gap:14px;
  align-items:flex-start;
  padding:16px 18px 14px;
  border-bottom:1px solid var(--line);
}
.day-num{
  font-family:'IBM Plex Mono',monospace;
  font-weight:600;
  font-size:24px;
  line-height:1;
  color:var(--accent);
  background:var(--accent-soft);
  border-radius:3px;
  padding:8px 10px;
  min-width:40px;
  text-align:center;
  flex:none;
}
.day-date{
  font-size:12.5px;
  font-weight:600;
  letter-spacing:.03em;
  color:var(--accent);
  text-transform:uppercase;
  margin-bottom:3px;
}
.day-title{font-size:17px; font-weight:600;}
.day-sub{color:var(--ink-muted); font-size:13px; margin-top:4px;}

.table-scroll{position:relative; overflow-x:auto; overflow-anchor:none; -webkit-overflow-scrolling:touch; padding-bottom:14px;}
.table-scroll.scrollable::after{
  content:"";
  position:absolute;
  top:0; right:0; bottom:0;
  width:22px;
  pointer-events:none;
  background:linear-gradient(90deg, transparent, var(--surface));
}
.scroll-hint{
  display:none;
  font-size:11.5px;
  color:var(--ink-muted);
  padding:4px 18px 14px;
}
.table-scroll.scrollable + .scroll-hint{display:block;}
table.timetable{
  border-collapse:collapse;
  width:max-content;
  min-width:100%;
}
table.timetable thead th{
  text-align:left;
  font-size:11.5px;
  font-weight:600;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--ink-muted);
  padding:8px 18px;
  border-bottom:1px solid var(--line-strong);
}
table.timetable td{
  padding:9px 18px;
  border-bottom:1px solid var(--line);
  vertical-align:top;
  font-size:13.5px;
}
table.timetable tbody tr:nth-child(even){background:var(--surface-2);}
table.timetable td.time{
  font-family:'IBM Plex Mono',monospace;
  font-weight:600;
  color:var(--accent);
  white-space:nowrap;
}
table.timetable td.activity{white-space:nowrap;}
table.timetable td.note{font-size:12.5px; white-space:nowrap;}
table.timetable td.note a{
  display:inline-flex;
  align-items:center;
  gap:3px;
  text-decoration:none;
  font-weight:600;
  white-space:nowrap;
}
table.timetable td.note a::after{content:"↗"; font-size:10px;}
table.timetable td.note a + a{margin-top:4px;}
table.timetable td.note .links{display:flex; flex-direction:column; gap:4px;}
table.timetable b{font-weight:700;}

/* =========================================================
   Animations & micro-interactions
   ========================================================= */
:root{
  --sun:#d6453a;
  --momiji:#e0662f;
  --ease-out:cubic-bezier(.22,1,.36,1);
}

/* ---- Scroll progress bar ---- */
.progress{
  position:fixed; top:0; left:0; right:0;
  height:3px; z-index:20;
  background:linear-gradient(90deg, var(--momiji), var(--sun) 60%, var(--accent));
  transform-origin:0 50%;
  transform:scaleX(0);
  pointer-events:none;
}

/* ---- Masthead entrance ---- */
.masthead{position:relative; overflow:hidden;}
.masthead > *:not(.hero-art){
  opacity:0;
  transform:translateY(14px);
  animation:rise .8s var(--ease-out) forwards;
}
.masthead .eyebrow{animation-delay:.05s;}
.masthead h1{animation-delay:.15s;}
.masthead .sub{animation-delay:.28s;}
.masthead .countdown{animation-delay:.42s;}
@keyframes rise{to{opacity:1; transform:none;}}

.hero-art{
  position:absolute; right:-6px; bottom:-2px;
  width:min(210px,42vw); height:auto;
  pointer-events:none;
  opacity:.9;
}
.masthead > *:not(.hero-art){position:relative; z-index:1;}
.masthead .sub{max-width:calc(100% - min(150px,30vw));}
.hero-art .sun{
  transform-box:fill-box; transform-origin:center;
  animation:sunrise 1.6s .2s var(--ease-out) both, sunglow 4s 1.8s ease-in-out infinite;
}
@keyframes sunrise{from{transform:translateY(60px); opacity:0;} to{transform:none; opacity:1;}}
@keyframes sunglow{50%{transform:scale(1.06);}}
.hero-art .fuji{animation:rise 1s .1s var(--ease-out) both;}
.hero-art .cloud{animation:drift 9s ease-in-out infinite alternate;}
.hero-art .cloud.c2{animation-duration:12s; animation-delay:-4s;}
@keyframes drift{from{transform:translateX(-10px);} to{transform:translateX(14px);}}

/* ---- Countdown / today badge ---- */
.countdown{
  display:inline-flex; align-items:center; gap:8px;
  margin-top:12px;
  font-size:13px; font-weight:600;
  color:var(--warn);
  background:var(--warn-soft);
  border-radius:999px;
  padding:4px 12px 4px 8px;
}
.countdown .dot{
  width:8px; height:8px; border-radius:50%;
  background:var(--sun);
  box-shadow:0 0 0 0 rgba(214,69,58,.55);
  animation:pulse 1.8s ease-out infinite;
}
.countdown .n{font-family:'IBM Plex Mono',monospace; font-size:15px;}
@keyframes pulse{to{box-shadow:0 0 0 9px rgba(214,69,58,0);}}

/* ---- Nav: active chip (scroll-spy) ---- */
.platform-nav a{
  transition:background .25s, color .25s, transform .25s var(--ease-out), border-color .25s;
}
.platform-nav a:hover{transform:translateY(-2px);}
.platform-nav a.active{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}
.platform-nav a.today{position:relative;}
.platform-nav a.today::after{
  content:""; position:absolute; top:-3px; right:-3px;
  width:8px; height:8px; border-radius:50%;
  background:var(--sun);
  animation:pulse 1.8s ease-out infinite;
}

/* ---- Overview rows: clickable ---- */
table.overview tbody tr{cursor:pointer; transition:background .2s;}
table.overview tbody tr td.num{transition:transform .25s var(--ease-out);}
table.overview tbody tr:hover td.num{transform:translateX(4px);}

/* ---- Day boards: reveal on scroll ---- */
.js-anim .reveal{
  opacity:0;
  transform:translateY(28px) scale(.985);
  transition:opacity .7s var(--ease-out), transform .7s var(--ease-out), box-shadow .3s;
}
.js-anim .reveal.in{opacity:1; transform:none;}
.day-board{transition:box-shadow .3s, transform .3s var(--ease-out);}
@media (hover:hover){
  .day-board.in:hover{box-shadow:0 10px 28px -12px rgba(20,22,26,.22);}
}
.js-anim .day-board .day-num{transform:scale(.6) rotate(-8deg); opacity:0; transition:transform .6s .15s cubic-bezier(.34,1.56,.64,1), opacity .4s .15s;}
.js-anim .day-board.in .day-num{transform:none; opacity:1;}
.js-anim .day-board tbody tr{
  opacity:0; transform:translateX(-10px);
  transition:opacity .45s var(--ease-out), transform .45s var(--ease-out);
  transition-delay:calc(.25s + var(--i,0) * 55ms);
}
.js-anim .day-board.in tbody tr{opacity:1; transform:none;}

/* Highlight a board after jumping to it */
.day-board.flash{animation:flash 1.4s ease-out;}
@keyframes flash{
  0%{box-shadow:0 0 0 0 rgba(38,83,156,.0);}
  20%{box-shadow:0 0 0 4px rgba(38,83,156,.35);}
  100%{box-shadow:0 0 0 0 rgba(38,83,156,0);}
}
.day-board.is-today{border-color:var(--sun);}
.day-board.is-today .day-num{background:var(--sun); color:#fff;}

/* Links: arrow nudge */
table.timetable td.note a::after{transition:transform .2s var(--ease-out);}
table.timetable td.note a:hover::after{transform:translate(2px,-2px);}

/* ---- Falling momiji leaves ---- */
.leaves{position:fixed; inset:0; pointer-events:none; z-index:8; overflow:hidden;}
.leaf{
  position:absolute; top:-40px;
  font-size:var(--s,18px);
  opacity:.7;
  animation:fall var(--d,12s) linear forwards;
  will-change:transform;
}
.leaf > span{display:inline-block; animation:sway var(--sw,3s) ease-in-out infinite alternate;}
@keyframes fall{
  to{transform:translate3d(var(--x,40px), 110vh, 0) rotate(var(--r,360deg));}
}
@media (max-width:700px){ .leaf{opacity:.45;} }
@keyframes sway{from{transform:translateX(-14px) rotate(-20deg);} to{transform:translateX(14px) rotate(25deg);}}


/* ---- Floating buttons (leaves toggle + back-to-top) ---- */
.fab{
  position:fixed; right:16px; z-index:10;
  width:44px; height:44px; border-radius:50%;
  border:1px solid var(--line);
  background:var(--surface);
  box-shadow:0 4px 14px -6px rgba(20,22,26,.3);
  display:grid; place-items:center;
  cursor:pointer;
  font-size:18px;
  transition:transform .3s var(--ease-out), opacity .3s;
}
.fab:hover{transform:translateY(-3px);}
.fab:active{transform:scale(.92);}
.to-top{bottom:20px; opacity:0; pointer-events:none; transform:translateY(12px);}
.to-top.show{opacity:1; pointer-events:auto; transform:none;}
.to-top svg{position:absolute; inset:-1px; transform:rotate(-90deg);}
.to-top circle{fill:none; stroke-width:3;}
.to-top .ring-bg{stroke:var(--line);}
.to-top .ring{stroke:var(--sun); stroke-linecap:round; transition:stroke-dashoffset .1s linear;}
.to-top .arrow{position:relative; color:var(--accent); font-weight:700;}
.leaf-toggle{bottom:74px;}
.leaf-toggle.off{filter:grayscale(1); opacity:.55;}

/* ---- Per-day mini scenes ---- */
.day-head{flex-wrap:wrap;}
.day-head > .day-text{flex:1 1 260px; min-width:0;}
.scene{
  position:relative;
  flex:0 0 190px; height:74px;
  margin-left:auto;
  border-radius:12px;
  overflow:hidden;
  background:var(--sky, linear-gradient(#eef4fb, #f8fafc));
  box-shadow:inset 0 0 0 1px rgba(20,22,26,.05);
}
.scene::after{ /* ground */
  content:""; position:absolute; left:0; right:0; bottom:0; height:12px;
  background:var(--ground, rgba(20,22,26,.04));
}
@media (max-width:600px){
  .scene{flex-basis:100%; height:64px; margin-left:0;}
}
.sc{
  position:absolute; z-index:1;
  line-height:1;
  display:inline-block;
  animation-duration:var(--t,3s);
  animation-delay:var(--d,0s);
  animation-iteration-count:infinite;
  animation-timing-function:ease-in-out;
  animation-play-state:paused;
  transform-origin:50% 100%;
}
.scene.playing .sc{animation-play-state:running;}
.sc.bob{animation-name:sc-bob; animation-direction:alternate;}
.sc.sway{animation-name:sc-sway; animation-direction:alternate;}
.sc.hop{animation-name:sc-hop;}
.sc.wave{animation-name:sc-wave; transform-origin:70% 90%;}
.sc.pulse{animation-name:sc-pulse;}
.sc.twinkle{animation-name:sc-twinkle;}
.sc.rise{animation-name:sc-rise; animation-timing-function:ease-out;}
.sc.fall{animation-name:sc-fall; animation-timing-function:linear;}
.sc.drop{animation-name:sc-drop; animation-timing-function:cubic-bezier(.5,0,.75,0);}
.sc.jump{animation-name:sc-jump; animation-timing-function:linear;}
.sc.swim{animation-name:sc-swim; animation-timing-function:linear;}
.sc.drive{animation-name:sc-drive; animation-timing-function:linear;}
.sc.fly{animation-name:sc-fly; animation-timing-function:linear;}
.sc.takeoff{animation-name:sc-takeoff; animation-timing-function:ease-in;}
.sc.roll{animation-name:sc-roll; transform-origin:50% 50%;}
.sc.stomp{animation-name:sc-stomp;}
.sc.wand{animation-name:sc-wand; transform-origin:15% 85%;}
.sc.broom{animation-name:sc-broom; animation-timing-function:linear;}
.sc.swing{animation-name:sc-swing; transform-origin:50% 0; animation-direction:alternate;}
@keyframes sc-bob{from{transform:translateY(0);} to{transform:translateY(-5px);}}
@keyframes sc-sway{from{transform:rotate(-9deg);} to{transform:rotate(9deg);}}
@keyframes sc-hop{0%,55%,100%{transform:translateY(0) scale(1,1);} 15%{transform:translateY(0) scale(1.1,.88);} 32%{transform:translateY(-16px) scale(.95,1.06);} 50%{transform:translateY(0) scale(1.08,.92);}}
@keyframes sc-wave{0%,60%,100%{transform:rotate(0);} 10%,30%{transform:rotate(18deg);} 20%,40%{transform:rotate(-8deg);}}
@keyframes sc-pulse{0%,100%{transform:scale(1);} 50%{transform:scale(1.15);}}
@keyframes sc-twinkle{0%,100%{transform:scale(0) rotate(0); opacity:0;} 40%{transform:scale(1) rotate(45deg); opacity:1;} 70%{transform:scale(.4) rotate(90deg); opacity:.6;}}
@keyframes sc-rise{0%{transform:translateY(4px) scale(.5); opacity:0;} 25%{opacity:.85;} 100%{transform:translateY(-40px) scale(1.4); opacity:0;}}
@keyframes sc-fall{0%{transform:translate(0,-30px) rotate(0); opacity:0;} 10%{opacity:1;} 100%{transform:translate(18px,90px) rotate(300deg); opacity:.2;}}
@keyframes sc-drop{0%{transform:translateY(-44px); opacity:0;} 10%{opacity:1;} 70%,100%{transform:translateY(0); opacity:1;} }
@keyframes sc-jump{0%,45%{transform:translate(0,30px) rotate(20deg); opacity:0;} 50%{opacity:1;} 72%{transform:translate(-24px,-6px) rotate(-10deg);} 95%{transform:translate(-48px,30px) rotate(-45deg); opacity:1;} 100%{transform:translate(-48px,36px) rotate(-50deg); opacity:0;}}
@keyframes sc-swim{0%{transform:translateX(0) scaleX(1);} 48%{transform:translateX(-46px) scaleX(1);} 50%{transform:translateX(-46px) scaleX(-1);} 98%{transform:translateX(0) scaleX(-1);} 100%{transform:translateX(0) scaleX(1);}}
@keyframes sc-drive{0%{transform:translate(120px,0);} 25%{transform:translate(60px,-1px);} 50%{transform:translate(0,0);} 75%{transform:translate(-60px,-1px);} 100%{transform:translate(-120px,0);}}
@keyframes sc-fly{0%{transform:translate(-110px,22px) rotate(8deg);} 100%{transform:translate(130px,-26px) rotate(8deg);}}
@keyframes sc-takeoff{0%,15%{transform:translate(0,0); opacity:1;} 100%{transform:translate(120px,-60px); opacity:0;}}
@keyframes sc-roll{0%,20%{transform:translateX(0) rotate(0);} 50%{transform:translateX(26px) rotate(360deg);} 70%{transform:translateX(26px) rotate(360deg);} 100%{transform:translateX(0) rotate(0);}}
@keyframes sc-stomp{0%,100%{transform:translateY(0) rotate(0);} 25%{transform:translateY(-6px) rotate(-6deg);} 50%{transform:translateY(0) rotate(0);} 75%{transform:translateY(-6px) rotate(6deg);}}
@keyframes sc-wand{0%,100%{transform:rotate(0);} 20%{transform:rotate(-25deg);} 40%{transform:rotate(15deg);} 60%{transform:rotate(-10deg);}}
@keyframes sc-broom{0%{transform:translate(-120px,10px);} 50%{transform:translate(10px,-8px);} 100%{transform:translate(140px,10px);}}
@keyframes sc-swing{from{transform:rotate(-12deg);} to{transform:rotate(12deg);}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}
  .leaves,.leaf-toggle{display:none;}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div class="eyebrow">Family trip itinerary</div>
    <h1>แผนเที่ยวญี่ปุ่น 7–19 ต.ค. 2026</h1>
    <div class="sub">ตารางสรุปกิจกรรมแบบละเอียดทั้ง 13 วัน — อิบารากิ → นิกโก้ → คุซัทสึ → คาวากุจิโกะ → โตเกียว</div>
    <div class="countdown" id="countdown" hidden></div>
    <svg class="hero-art" viewBox="0 0 220 120" aria-hidden="true">
      <circle class="sun" cx="150" cy="46" r="24" fill="#d6453a"/>
      <g class="cloud"><ellipse cx="60" cy="34" rx="22" ry="6" fill="#fff" opacity=".9"/><ellipse cx="72" cy="29" rx="12" ry="6" fill="#fff" opacity=".9"/></g>
      <g class="fuji">
        <path d="M10 120 L92 44 Q110 30 128 44 L210 120 Z" fill="#26539c"/>
        <path d="M92 44 Q110 30 128 44 L139 54 L127 50 L118 58 L110 50 L101 58 L93 50 L81 54 Z" fill="#fff"/>
      </g>
      <g class="cloud c2"><ellipse cx="176" cy="82" rx="26" ry="6" fill="#fff" opacity=".85"/><ellipse cx="190" cy="77" rx="12" ry="5" fill="#fff" opacity=".85"/></g>
    </svg>
  </div>

  <nav class="platform-nav" id="platformNav" aria-label="กระโดดไปวันที่ต้องการ"></nav>

  <div class="section-label">ภาพรวมทั้งทริป</div>
  <div class="overview-scroll">
    <table class="overview">
      <thead>
        <tr><th>วัน</th><th>วันที่</th><th>ธีมของวัน</th></tr>
      </thead>
      <tbody id="overviewBody"></tbody>
    </table>
  </div>

  <div class="section-label">รายละเอียดกิจกรรมรายวัน</div>
  <div id="days"></div>
</div>

<div class="progress" id="progress"></div>
<div class="leaves" id="leaves" aria-hidden="true"></div>

function dateNum(dateStr){
  const m = dateStr.match(/(\d+)\s*ต\.ค/);
  return m ? m[1] : '';
}
const DAY_ABBR = {
  'จันทร์':'จ.', 'อังคาร':'อ.', 'พุธ':'พ.', 'พฤหัสบดี':'พฤ.',
  'ศุกร์':'ศ.', 'เสาร์':'ส.', 'อาทิตย์':'อา.'
};
function dayAbbr(dateStr){
  const w = dateStr.trim().split(/\s+/)[0];
  return DAY_ABBR[w] || '';
}
function cleanDate(dateStr){
  return dateStr.split(' ·')[0].trim();
}
function extractLinks(html){
  const re = /<a\s+href="([^"]+)"[^>]*>([^<]+)<\/a>/g;
  const links = [];
  let m;
  while((m = re.exec(html))){
    links.push({href: m[1], text: m[2]});
  }
  const cleaned = html.replace(re, (full, href, text) => text);
  return {links, cleaned};
}

function sceneHtml(i){
  const sc = SCENES[i];
  if (!sc) return '';
  const items = sc.items.map(([e,a,x,y,size,d,t]) =>
    '<span class="sc ' + a + '" style="left:' + x + '%;bottom:' + y + 'px;font-size:' + size + 'px;--d:' + (-d) + 's;--t:' + t + 's">' + e + '</span>'
  ).join('');
  return '<div class="scene" aria-hidden="true" style="' + (sc.sky ? '--sky:' + sc.sky + ';' : '') + (sc.ground ? '--ground:' + sc.ground : '') + '">' + items + '</div>';
}

daysEl.innerHTML = DAYS.map((d,i) => {
  const rows = d.table.map((r, ri) => {
    const {links, cleaned} = extractLinks(r[1]);
    const noteHtml = links.length
      ? '<div class="links">' + links.map(l =>
          '<a href="' + l.href + '" target="_blank" rel="noopener">' + l.text + '</a>'
        ).join('') + '</div>'
      : '';
    return '<tr style="--i:' + ri + '">'
      + '<td class="time">' + r[0] + '</td>'
      + '<td class="activity">' + cleaned + '</td>'
      + '<td class="note">' + noteHtml + '</td>'
    + '</tr>';
  }).join('');

  return '<section class="day-board reveal" id="day-' + (i+1) + '">'
    + '<div class="day-head">'
      + '<div class="day-num">' + dateNum(d.date) + '</div>'
      + '<div class="day-text">'

        + '<h2 class="day-title">' + d.title + '</h2>'
        + '<div class="day-sub">' + d.sub + '</div>'
      + '</div>'

      + '<thead><tr><th>เวลา</th><th>กิจกรรม</th><th>หมายเหตุ</th></tr></thead>'

}).join('');

  const cd = document.getElementById('countdown');
  if (dayIdx < 0) {
    cd.innerHTML = '<span class="dot"></span>อีก <span class="n" id="cdN">0</span> วันออกเดินทาง ✈️';
    cd.hidden = false;
    const target = -dayIdx, n = document.getElementById('cdN');
    if (reduceMotion) n.textContent = target;
    else {
      const t0 = performance.now();
      (function tick(t){
        const p = Math.min(1, (t - t0) / 1200);
        n.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
        if (p < 1) requestAnimationFrame(tick);
      })(t0);
    }
  } else if (dayIdx < DAYS.length) {
    cd.innerHTML = '<span class="dot"></span>วันนี้ Day ' + (dayIdx + 1) + ' — ' + DAYS[dayIdx].title;
    cd.hidden = false;
    cd.style.cursor = 'pointer';
    cd.addEventListener('click', () => jumpTo(dayIdx));
    boards[dayIdx].classList.add('is-today');
    navLinks[dayIdx].classList.add('today');
  }

  // Jump to a day with a flash highlight
  function jumpTo(i){
    const b = boards[i];
    b.scrollIntoView({behavior: reduceMotion ? 'auto' : 'smooth', block: 'start'});
    b.classList.add('in');
    b.classList.remove('flash'); void b.offsetWidth; b.classList.add('flash');
    history.replaceState(null, '', '#day-' + (i + 1));
  }
  navLinks.forEach((a, i) => a.addEventListener('click', e => { e.preventDefault(); jumpTo(i); }));
  [...overviewBody.rows].forEach((tr, i) => tr.addEventListener('click', e => {
    if (!e.target.closest('a')) jumpTo(i);
  }));

  // Reveal boards on scroll
  if ('IntersectionObserver' in window && !reduceMotion) {
    document.documentElement.classList.add('js-anim');
    const io = new IntersectionObserver(entries => entries.forEach(en => {
      if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
    }), {rootMargin: '0px 0px -8% 0px', threshold: 0.06});
    boards.forEach(b => io.observe(b));
  }
  // Only run a day's scene while it is on screen
  const scenes = document.querySelectorAll('.scene');
  if ('IntersectionObserver' in window) {
    const so = new IntersectionObserver(entries => entries.forEach(en =>
      en.target.classList.toggle('playing', en.isIntersecting)));
    scenes.forEach(el => so.observe(el));
  } else scenes.forEach(el => el.classList.add('playing'));
  boards.forEach(b => b.addEventListener('animationend', () => b.classList.remove('flash')));

  // Scroll progress, scroll-spy, back-to-top ring
  const bar = document.getElementById('progress');
  const toTop = document.getElementById('toTop');
  const ring = toTop.querySelector('.ring');
  const C = 2 * Math.PI * 20;
  ring.style.strokeDasharray = C;
  let active = -1, ticking = false;
  function onScroll(){
    ticking = false;
    const max = document.documentElement.scrollHeight - innerHeight;
    const p = max > 0 ? Math.min(1, scrollY / max) : 0;
    bar.style.transform = 'scaleX(' + p + ')';
    ring.style.strokeDashoffset = C * (1 - p);
    toTop.classList.toggle('show', scrollY > innerHeight * 0.8);

    let cur = -1;
    const line = innerHeight * 0.35;
    boards.forEach((b, i) => { if (b.getBoundingClientRect().top < line) cur = i; });
    if (cur !== active) {
      if (active >= 0) navLinks[active].classList.remove('active');
      if (cur >= 0) {
        const a = navLinks[cur];
        a.classList.add('active');
        platformNav.scrollTo({left: a.offsetLeft - platformNav.clientWidth / 2 + a.offsetWidth / 2, behavior: reduceMotion ? 'auto' : 'smooth'});
      }
      active = cur;
    }
  }
  addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, {passive: true});
  addEventListener('resize', onScroll);
  onScroll();
  toTop.addEventListener('click', () => scrollTo({top: 0, behavior: reduceMotion ? 'auto' : 'smooth'}));

  // Falling momiji leaves (autumn in October)
  if (reduceMotion) return;
  const leavesEl = document.getElementById('leaves');
  const toggle = document.getElementById('leafToggle');
  const ICONS = ['🍁', '🍁', '🍂', '🍁'];
  let on = true, timer = null;
  try { on = localStorage.getItem('leaves') !== 'off'; } catch (e) {}
  function spawn(){
    if (document.hidden || leavesEl.childElementCount > (innerWidth < 700 ? 5 : 14)) return;
    const el = document.createElement('div');
    el.className = 'leaf';
    const rnd = (a, b) => a + Math.random() * (b - a);
    el.style.left = rnd(0, 100) + 'vw';
    el.style.setProperty('--s', rnd(14, 26) + 'px');
    el.style.setProperty('--d', rnd(10, 18) + 's');
    el.style.setProperty('--x', rnd(-120, 120) + 'px');
    el.style.setProperty('--r', rnd(-540, 540) + 'deg');
    el.style.setProperty('--sw', rnd(2, 4) + 's');
    el.innerHTML = '<span>' + ICONS[Math.floor(Math.random() * ICONS.length)] + '</span>';
    el.addEventListener('animationend', ev => { if (ev.target === el) el.remove(); });
    leavesEl.appendChild(el);
  }
  function setLeaves(v){
    on = v;
    toggle.classList.toggle('off', !on);
    toggle.setAttribute('aria-pressed', String(on));
    try { localStorage.setItem('leaves', on ? 'on' : 'off'); } catch (e) {}
    clearInterval(timer);
    if (on) { for (let k = 0; k < 4; k++) setTimeout(spawn, k * 600); timer = setInterval(spawn, innerWidth < 700 ? 2600 : 1400); }
    else leavesEl.innerHTML = '';
  }
  toggle.addEventListener('click', () => setLeaves(!on));
  setLeaves(on);
})();
</script>
</body>
</html>
