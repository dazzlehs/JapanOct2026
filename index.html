<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แผนเที่ยวญี่ปุ่น 7–19 ต.ค. 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0f1;
  --surface:#ffffff;
  --surface-2:#f6f7f8;
  --ink:#16191d;
  --ink-muted:#6b7280;
  --line:#e7e9ec;
  --line-strong:#16191d;
  --accent:#26539c;
  --accent-soft:#eef2f9;
  --accent-ink:#1c3d73;
  --warn:#ad2b21;
  --warn-soft:#fbeceb;
  --tip:#8a5c12;
  --tip-soft:#faf3e6;
  --shadow: 0 1px 2px rgba(20,22,26,.05);
  color-scheme: light;
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'IBM Plex Sans Thai Looped','Noto Sans',system-ui,sans-serif;
  font-size:15px;
  line-height:1.65;
  padding-inline:16px;
  padding-bottom:40px;
}
h1,h2{font-family:'IBM Plex Sans Thai Looped',sans-serif; text-wrap:balance; margin:0;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}

a{color:var(--accent);}

.wrap{max-width:1180px; margin:0 auto;}

/* ---- Masthead ---- */
.masthead{
  padding-block:26px 16px;
  border-bottom:1px solid var(--line-strong);
  margin-bottom:18px;
}
.eyebrow{
  font-size:12px;
  font-weight:600;
  letter-spacing:.12em;
  color:var(--accent);
  text-transform:uppercase;
  margin-bottom:6px;
}
.masthead h1{
  font-size:clamp(22px,5vw,30px);
  font-weight:700;
  color:var(--ink);
}
.masthead .sub{
  color:var(--ink-muted);
  margin-top:6px;
  font-size:13.5px;
}

/* ---- Date-jump nav ---- */
.platform-nav{
  position:sticky;
  top:0;
  z-index:5;
  background:var(--bg);
  padding-block:10px;
  margin-bottom:22px;
  border-bottom:1px solid var(--line);
  display:flex;
  gap:6px;
  overflow-x:auto;
  scrollbar-width:none;
}
.platform-nav::-webkit-scrollbar{display:none;}
.platform-nav a{
  flex:none;
  font-family:'IBM Plex Sans Thai Looped',sans-serif;
  font-weight:600;
  font-size:13px;
  text-decoration:none;
  color:var(--accent-ink);
  background:var(--accent-soft);
  border:1px solid var(--line);
  border-radius:3px;
  padding:5px 10px;
}

/* ---- Overview table ---- */
.section-label{
  font-weight:600;
  font-size:12px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--ink-muted);
  margin:0 0 10px;
}
.overview-scroll{
  overflow-x:auto;
  border:1px solid var(--line);
  border-radius:4px;
  margin-bottom:34px;
  box-shadow:var(--shadow);
  background:var(--surface);
}
table.overview{
  width:100%;
  border-collapse:collapse;
  min-width:480px;
}
table.overview thead th{
  text-align:left;
  font-size:12px;
  font-weight:600;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--ink-muted);
  background:var(--surface-2);
  padding:10px 12px;
  white-space:nowrap;
  border-bottom:1px solid var(--line-strong);
}
table.overview tbody td{
  padding:10px 12px;
  border-bottom:1px solid var(--line);
  vertical-align:top;
  font-size:13.5px;
}
table.overview tbody tr:last-child td{border-bottom:none;}
table.overview tbody tr:hover{background:var(--surface-2);}
table.overview td.num{
  font-family:'IBM Plex Mono',monospace;
  font-weight:600;
  color:var(--accent);
  white-space:nowrap;
}
table.overview td.date{white-space:nowrap; color:var(--ink-muted);}
table.overview td.theme b{font-weight:600;}

/* ---- Day boards ---- */
.day-board{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:4px;
  box-shadow:var(--shadow);
  margin-bottom:26px;
  overflow:hidden;
  scroll-margin-top:56px;
}
.day-head{
  display:flex;
  gap:14px;
  align-items:flex-start;
  padding:16px 18px 14px;
  border-bottom:1px solid var(--line);
}
.day-num{
  font-family:'IBM Plex Mono',monospace;
  font-weight:600;
  font-size:24px;
  line-height:1;
  color:var(--accent);
  background:var(--accent-soft);
  border-radius:3px;
  padding:8px 10px;
  min-width:40px;
  text-align:center;
  flex:none;
}
.day-date{
  font-size:12.5px;
  font-weight:600;
  letter-spacing:.03em;
  color:var(--accent);
  text-transform:uppercase;
  margin-bottom:3px;
}
.day-title{font-size:17px; font-weight:600;}
.day-sub{color:var(--ink-muted); font-size:13px; margin-top:4px;}

.table-scroll{position:relative; overflow-x:auto; overflow-anchor:none; -webkit-overflow-scrolling:touch; padding-bottom:14px;}
.table-scroll.scrollable::after{
  content:"";
  position:absolute;
  top:0; right:0; bottom:0;
  width:22px;
  pointer-events:none;
  background:linear-gradient(90deg, transparent, var(--surface));
}
.scroll-hint{
  display:none;
  font-size:11.5px;
  color:var(--ink-muted);
  padding:4px 18px 14px;
}
.table-scroll.scrollable + .scroll-hint{display:block;}
table.timetable{
  border-collapse:collapse;
  width:max-content;
  min-width:100%;
}
table.timetable thead th{
  text-align:left;
  font-size:11.5px;
  font-weight:600;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--ink-muted);
  padding:8px 18px;
  border-bottom:1px solid var(--line-strong);
}
table.timetable td{
  padding:9px 18px;
  border-bottom:1px solid var(--line);
  vertical-align:top;
  font-size:13.5px;
}
table.timetable tbody tr:nth-child(even){background:var(--surface-2);}
table.timetable td.time{
  font-family:'IBM Plex Mono',monospace;
  font-weight:600;
  color:var(--accent);
  white-space:nowrap;
}
table.timetable td.activity{white-space:nowrap;}
table.timetable td.note{font-size:12.5px; white-space:nowrap;}
table.timetable td.note a{
  display:inline-flex;
  align-items:center;
  gap:3px;
  text-decoration:none;
  font-weight:600;
  white-space:nowrap;
}
table.timetable td.note a::after{content:"↗"; font-size:10px;}
table.timetable td.note a + a{margin-top:4px;}
table.timetable td.note .links{display:flex; flex-direction:column; gap:4px;}
table.timetable b{font-weight:700;}
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div class="eyebrow">Family trip itinerary</div>
    <h1>แผนเที่ยวญี่ปุ่น 7–19 ต.ค. 2026</h1>
    <div class="sub">ตารางสรุปกิจกรรมแบบละเอียดทั้ง 13 วัน — อิบารากิ → นิกโก้ → คุซัทสึ → คาวากุจิโกะ → โตเกียว</div>
  </div>

  <nav class="platform-nav" id="platformNav" aria-label="กระโดดไปวันที่ต้องการ"></nav>

  <div class="section-label">ภาพรวมทั้งทริป</div>
  <div class="overview-scroll">
    <table class="overview">
      <thead>
        <tr><th>วัน</th><th>วันที่</th><th>ธีมของวัน</th></tr>
      </thead>
      <tbody id="overviewBody"></tbody>
    </table>
  </div>

  <div class="section-label">รายละเอียดกิจกรรมรายวัน</div>
  <div id="days"></div>
</div>

function dateNum(dateStr){
  const m = dateStr.match(/(\d+)\s*ต\.ค/);
  return m ? m[1] : '';
}
const DAY_ABBR = {
  'จันทร์':'จ.', 'อังคาร':'อ.', 'พุธ':'พ.', 'พฤหัสบดี':'พฤ.',
  'ศุกร์':'ศ.', 'เสาร์':'ส.', 'อาทิตย์':'อา.'
};
function dayAbbr(dateStr){
  const w = dateStr.trim().split(/\s+/)[0];
  return DAY_ABBR[w] || '';
}
function cleanDate(dateStr){
  return dateStr.split(' ·')[0].trim();
}
function extractLinks(html){
  const re = /<a\s+href="([^"]+)"[^>]*>([^<]+)<\/a>/g;
  const links = [];
  let m;
  while((m = re.exec(html))){
    links.push({href: m[1], text: m[2]});
  }
  const cleaned = html.replace(re, (full, href, text) => text);
  return {links, cleaned};
}

const platformNav = document.getElementById('platformNav');
const overviewBody = document.getElementById('overviewBody');
const daysEl = document.getElementById('days');

platformNav.innerHTML = DAYS.map((d,i) => '<a href="#day-'+(i+1)+'">'+dateNum(d.date)+' '+dayAbbr(d.date)+'</a>').join('');

overviewBody.innerHTML = DAYS.map((d,i) =>
  '<tr>'
    + '<td class="num">Day ' + (i+1) + '</td>'
    + '<td class="date">' + cleanDate(d.date) + '</td>'
    + '<td class="theme"><b>' + d.title + '</b></td>'
  + '</tr>'
).join('');

daysEl.innerHTML = DAYS.map((d,i) => {
  const rows = d.table.map(r => {
    const {links, cleaned} = extractLinks(r[1]);
    const noteHtml = links.length
      ? '<div class="links">' + links.map(l =>
          '<a href="' + l.href + '" target="_blank" rel="noopener">' + l.text + '</a>'
        ).join('') + '</div>'
      : '';
    return '<tr>'
      + '<td class="time">' + r[0] + '</td>'
      + '<td class="activity">' + cleaned + '</td>'
      + '<td class="note">' + noteHtml + '</td>'
    + '</tr>';
  }).join('');

  return '<section class="day-board" id="day-' + (i+1) + '">'
    + '<div class="day-head">'
      + '<div class="day-num">' + dateNum(d.date) + '</div>'
      + '<div>'
        + '<div class="day-date">' + cleanDate(d.date) + '</div>'
        + '<h2 class="day-title">' + d.title + '</h2>'
        + '<div class="day-sub">' + d.sub + '</div>'
      + '</div>'
    + '</div>'
    + '<div class="table-scroll"><table class="timetable">'
      + '<thead><tr><th>เวลา</th><th>กิจกรรม</th><th>หมายเหตุ</th></tr></thead>'
      + '<tbody>' + rows + '</tbody>'
    + '</table></div>'
    + '<div class="scroll-hint">← เลื่อนดูตารางทั้งหมด →</div>'
  + '</section>';
}).join('');

document.querySelectorAll('.table-scroll').forEach(el => {
  if (el.scrollWidth > el.clientWidth + 1) el.classList.add('scrollable');
});
</script>
